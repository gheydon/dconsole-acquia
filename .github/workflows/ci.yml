name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The go.mod has a `replace github.com/dconsole/dconsole => ../dconsole`
      # directive for local co-development. Drop it in CI so the module
      # graph resolves against the pinned release instead of a missing
      # sibling directory.
      - name: strip local replace
        shell: bash
        run: |
          sed -i.bak '/^replace github.com\/dconsole\/dconsole/d' go.mod
          rm -f go.mod.bak
          go mod tidy

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 ./...
