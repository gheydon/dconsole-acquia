# Example dconsole manifest for a site hosted on Acquia Cloud.
# Copy this into your project repo as `.dconsole.yml`, replace
# `myapp` with your acli alias prefix, then:
#
#   dconsole project:register
#   dconsole @myapp.dev status
project: myapp
default_env: dev

_defaults:
  bin:
    kind: drush

dev:
  handler:
    type: acquia
    acquia:
      alias: myapp.dev

test:
  handler:
    type: acquia
    acquia:
      alias: myapp.test

prod:
  handler:
    type: acquia
    acquia:
      alias: myapp.prod

# The alias format matches acli's `<app>.<env>` convention. Each env's
# `handler:` block names the plugin (`type: acquia`) and carries the
# plugin's own config under `acquia:` — the plugin pulls it from
# envelope.Config["acquia"].
#
# To use acli's drush-specific wrapper instead of the generic ssh
# fan-out, add:
#
#     acquia:
#       alias: myapp.dev
#       cmd_prefix: [acli, remote:drush]
#
# (Without cmd_prefix the plugin defaults to `acli remote:ssh`.)
